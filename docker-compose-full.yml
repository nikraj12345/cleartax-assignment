services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brightpath
      POSTGRES_PASSWORD: brightpath
      POSTGRES_DB: brightpath
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightpath -d brightpath"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    ports:
      - "6333:6333"
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrantdata:/qdrant/storage

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    working_dir: /app/apps/api
    command: sh -c "npx prisma migrate deploy && npm run seed"
    environment:
      DATABASE_URL: postgresql://brightpath:brightpath@postgres:5432/brightpath
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: docker-demo-jwt-secret-min-32-chars
      ORCHESTRATOR_SERVICE_TOKEN: docker-orchestrator-token
      MOCK_PAYMENT_WEBHOOK_SECRET: mock-webhook-secret-demo
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://brightpath:brightpath@postgres:5432/brightpath
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: docker-demo-jwt-secret-min-32-chars
      ORCHESTRATOR_SERVICE_TOKEN: docker-orchestrator-token
      MOCK_PAYMENT_WEBHOOK_SECRET: mock-webhook-secret-demo
      ORCHESTRATOR_URL: http://orchestrator:3002
      API_PORT: "3001"
      LLM_MODE: fixture
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      API_URL: http://api:3001
      ORCHESTRATOR_SERVICE_TOKEN: docker-orchestrator-token
      ORCHESTRATOR_PORT: "3002"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODE: ${LLM_MODE:-live}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata: